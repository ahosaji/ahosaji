name: ahosaji

services:
  postgres:
    image: postgres:16-alpine
    container_name: ahosaji-postgres
    env_file: postgres.env
    ports:
      - "5433:5432"   # 5432 already used on this machine; ahosaji binds to 5433
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: ahosaji-meilisearch
    env_file: meilisearch.env
    ports:
      - "7701:7700"   # 7700 already used on this machine; ahosaji binds to 7701
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  meilidata:
