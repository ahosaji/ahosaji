name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gates the build: any type error in ingest, api, or sdk-ts fails CI.
      - name: Typecheck (all packages)
        run: pnpm -r typecheck

      # Report production dependency vulnerabilities; fail the build on HIGH
      # (or worse). `pnpm audit` exits non-zero when issues at/above the given
      # level are found, which fails the step.
      - name: Audit production dependencies (fail on HIGH)
        run: pnpm audit --prod --audit-level high
