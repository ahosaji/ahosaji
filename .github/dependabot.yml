version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Africa/Cairo
    open-pull-requests-limit: 5
    groups:
      compatible-workspace-updates:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Africa/Cairo
    groups:
      actions:
        patterns: ['*']
